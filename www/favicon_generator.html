<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>favicon_generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
		<a href="index.html" title="navigate through the tools on this site">index</a>
		<a href="avgcolor.html" title="get the average color of an image">avgcolor</a>
		<a href="avgpalette.html" title="get the average color of each tile in a tilesheet image">avgpalette</a>
		<a href="bitshift.html" title="see the result of bitshift operations">bitshift</a>
		<a href="favicon_generator.html" title="generate a favicon with configurable font, text, and colors">favicon_generator</a>
		<a href="hashfuncs.html" title="see the result of multiple hash functions on UTF-8 text">hashfuncs</a>
		<a href="mkchr.html" title="create a NES pattern table from an image">mkchr</a>
		<a href="padtiles.html" title="pad a tilesheet for texture smoothing">padtiles</a>
	</nav>
    <main>
        <canvas class="c-imagepreview" id="canvas" width="256" height="256"></canvas>
        <label>font family</label>
        <input id="font_input" type="text" value="bold 192px Comic Sans MS">
        <label>text</label>
        <input id="text_input" type="text" value="Hi">
        <label>foreground color</label>
        <input id="foreground_input" type="color" value="#030303">
        <label>background color</label>
        <input id="background_input" type="color" value="#fcfcfc">
    </main>
    <script>
        const canvas = document.getElementById("canvas");
        const fontInput = document.getElementById("font_input");
        const textInput = document.getElementById("text_input");
        const foregroundInput = document.getElementById("foreground_input");
        const backgroundInput = document.getElementById("background_input");
        const ctx = canvas.getContext("2d");

        function updateCanvas() {
            ctx.fillStyle = backgroundInput.value;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = fontInput.value;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = foregroundInput.value;
            ctx.fillText(textInput.value, canvas.width / 2, canvas.height / 2);
        }
        
        for (const input of [fontInput, textInput, foregroundInput, backgroundInput])
            input.oninput = e => updateCanvas();
        updateCanvas();
    </script>
</body>
</html>
