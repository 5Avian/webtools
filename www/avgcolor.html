<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>avgcolor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
		<a href="index.html" title="navigate through the tools on this site">index</a>
		<a href="avgcolor.html" title="get the average color of an image">avgcolor</a>
		<a href="avgpalette.html" title="get the average color of each tile in a tilesheet image">avgpalette</a>
		<a href="bitshift.html" title="see the result of bitshift operations">bitshift</a>
		<a href="favicon_generator.html" title="generate a favicon with configurable font, text, and colors">favicon_generator</a>
		<a href="hashfuncs.html" title="see the result of multiple hash functions on UTF-8 text">hashfuncs</a>
		<a href="mkchr.html" title="create a NES pattern table from an image">mkchr</a>
		<a href="padtiles.html" title="pad a tilesheet for texture smoothing">padtiles</a>
	</nav>
    <main>
        <canvas class="c-imagepreview" id="canvas" width="0" height="0"></canvas>
        <div class="c-filedrop" id="image_drop">drop image here</div>
        <hr>
        <label>average color</label>
        <div class="c-colorpreview" id="color_preview" style="background-color:#000000"></div>
        <button id="color_hex">000000</span>
    </main>
    <script>
        const canvas = document.getElementById("canvas");
        const imageDrop = document.getElementById("image_drop");
        const colorPreview = document.getElementById("color_preview");
        const colorHex = document.getElementById("color_hex");

        function computeAverageColor(imageData) {
            let r = 0, g = 0, b = 0;
            let numOpaquePixels = 0;
            for (let y = 0; y < imageData.height; y++) {
                for (let x = 0; x < imageData.width; x++) {
                    const i = (y * imageData.width + x) * 4;
                    const alpha = imageData.data[i + 3] / 255.0;
                    r += imageData.data[i + 0] * alpha;
                    g += imageData.data[i + 1] * alpha;
                    b += imageData.data[i + 2] * alpha;
                    numOpaquePixels += alpha;
                }
            }
            r /= numOpaquePixels;
            g /= numOpaquePixels;
            b /= numOpaquePixels;
            const hexColor = 
                Math.floor(r).toString(16).padStart(2, "0") +
                Math.floor(g).toString(16).padStart(2, "0") +
                Math.floor(b).toString(16).padStart(2, "0");
            colorPreview.style.backgroundColor = "#" + hexColor;
            colorHex.innerText = hexColor;
        }

        imageDrop.ondrop = e => {
            e.preventDefault();
			const file = e.dataTransfer.files[0];
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                URL.revokeObjectURL(url);
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0);
                computeAverageColor(ctx.getImageData(0, 0, img.width, img.height));
            };
            img.src = url;
        };
        imageDrop.ondragover = e => {
            e.preventDefault();
        }
        colorHex.onclick = e => {
            e.preventDefault();
            navigator.clipboard.writeText(colorHex.innerText);
        }
    </script>
</body>
</html>
